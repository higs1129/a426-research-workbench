design:
  name: "replace-me"
  top_cell: "TOP"
  mode: "new"
  dbu_um: 0.001
  source_intent: "Describe the sketch, KLayout selection, or legacy source."

process:
  profile: "sin-user-process"
  exposure_groups:
    - id: "main"
      writefield_size_um: null  # Resolve 500 or 1000 from the intended exposure.
  device_kind: null  # single or array; pads use the matching accepted component.
  width_reference: null  # top/bottom when sidewall geometry matters.
  gap_reference: null
  port_overrides: {}

layers:
  device: null  # Resolved to 1/y by the exposure group, includes optical mask text.
  writefield: null  # 30/y; actual field placement belongs in the project manifest.

change_scope:
  editable: []
  preserved: []
  recompute: []

unit_cell:
  family: "microring"
  source: "new"
  parameters:
    radius_um: null
    width_um: null
  tessellation:
    midpoint_chord_deviation_nm: 0.1  # Strict saved-geometry upper bound for SiN.

waveguide:
  width_um: null
  coupling_gap_um: null
  coupling_length_um: null
  route_kind: "euler-edge-transition"
  euler:
    min_radius_um: null
    points_per_90_deg: 256
  left_edge:
    straight_length_um: null
    vertical_drop_um: null
  right_edge:
    straight_length_um: null
    vertical_drop_um: null

ports:
  - name: "opt_in"
    role: "input"
    orientation_deg: 180
  - name: "opt_out"
    role: "output"
    orientation_deg: 0

verification:
  checks:
    - "gds_readback"
    - "critical_dimensions"
    - "route_continuity"
    - "ring_tessellation"

export:
  working_gds: null  # Generate only for a specific editing/debug purpose.
  clean_gds: "final-clean.gds"
  allowlist: ["device"]
